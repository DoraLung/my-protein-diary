tems:center;margin-top:22px}.goal input{width:85px}.goal button{background:#ffffff15;color:white;border-color:#ffffff40}.goal label{font-size:14px}h2{font-size:20px;margin:0 0 20px}.field{margin:18px 0}.field label{display:block;font-size:14px;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.primary{background:var(--green);color:white;border:0;width:100%;font-weight:600;margin-top:6px}.primary:hover{background:#603564}.hint{font-size:12px}.records{margin-top:24px}.record-title{display:flex;align-items:center;justify-content:space-between}.record-title small{color:var(--muted)}.meal{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.mealhead{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted)}.item{display:flex;align-items:center;gap:12px;padding:14px 0}.item .name{flex:1;overflow-wrap:anywhere}.item strong{color:var(--green);white-space:nowrap}.delete{border:0;padding:6px 9px;color:#8b756a;font-size:13px}.empty{text-align:center;padding:32px 15px;color:var(--muted)}.empty span{display:block;font-size:35px;margin-bottom:12px}.week{display:flex;gap:10px;align-items:end;height:145px;margin-top:25px}.day{flex:1;text-align:center;font-size:12px;color:var(--muted);cursor:pointer}.bar-wrap{height:105px;display:flex;align-items:end;justify-content:center}.bar{background:#d7bee7;width:65%;min-height:3px;border-radius:6px 6px 0 0}.day.active .bar{background:var(--green)}.day small{display:block;margin:6px 0}.footer{text-align:center;font-size:12px;margin-top:28px;color:var(--muted)}#status{min-height:22px;font-size:13px;color:var(--green);margin:12px 0 0}.tools{display:flex;gap:8px;margin-top:20px}.tools button{font-size:12px} @media(max-width:720px){header{padding:18px 20px}header small{display:none}main{padding:28px 18px}h1{font-size:28px}.grid{grid-template-columns:1fr}.card{padding:23px}.big{font-size:58px}.datebar{flex-wrap:wrap}.goal{flex-wrap:wrap}.tools{flex-wrap:wrap}}
</style></head><body><header><div class="brand">我的蛋白日記</div><small>一餐一筆，累積你的每日進度</small></header><main><div class="eyebrow">YOUR DAILY PROTEIN</div><h1>好好吃飯，記錄每一天。</h1><p>把每一餐記下來，讓蛋白質攝取變得清楚簡單。</p><div class="datebar"><button id="prev" aria-label="前一天">←</button><input type="date" id="date" aria-label="紀錄日期"><button id="next" aria-label="後一天">→</button><button id="today">回到今天</button></div><div class="grid"><section><div class="card progress"><h2>當日蛋白質攝取</h2><div class="big"><span id="total">0</span> <small>/ <span id="goalText">80</span> 克</small></div><div class="track" role="progressbar" aria-label="每日目標進度" id="progress"><div class="fill" id="fill"></div></div><div class="progress-bottom"><span id="remaining"></span><span id="percent"></span></div><form class="goal" id="goalForm"><label for="goal">每日目標</label><input id="goal" type="number" min="1" max="1000" step="0.1" required value="80" aria-label="每日目標克數"><span>克</span><button type="submit">儲存目標</button></form></div><div class="card records"><div class="record-title"><h2>飲食紀錄</h2><small id="count"></small></div><div id="list"></div></div></section><aside><div class="card"><h2>＋ 記錄這一餐</h2><form id="foodForm"><div class="field"><label for="food">食物名稱</label><input id="food" placeholder="例如：雞胸肉、豆漿" maxlength="80" required></div><div class="row"><div class="field"><label for="protein">蛋白質（克）</label><input id="protein" type="number" placeholder="例如：25" min="0.1" max="1000" step="0.1" required></div><div class="field"><label for="meal">餐別</label><select id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option></select></div></div><button class="primary" type="submit">新增飲食紀錄</button></form><p class="hint">依食品包裝標示或你已查到的資料，填入實際食用份量的蛋白質克數。</p><div id="status" role="status" aria-live="polite"></div></div><div class="card records"><h2>最近七天</h2><p class="hint">以所選日期為最後一天，點選日期查看紀錄。</p><div class="week" id="week"></div></div><div class="tools"><button id="export">匯出備份</button><button id="import">匯入備份</button><input type="file" id="file" accept="application/json,.json" hidden></div></aside></div><div class="footer">資料儲存在此瀏覽器。清除瀏覽器資料前，記得匯出備份。每日目標由你自行設定。</div></main><script>
'use strict';
const KEY='protein-diary-v1', $=id=>document.getElementById(id), meals=['早餐','午餐','晚餐','點心'];
const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const shift=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)};
const num=n=>Number(n.toFixed(1)).toString();let state={goal:80,entries:[]};
function valid(s){return s&&Number.isFinite(s.goal)&&s.goal>=1&&s.goal<=1000&&Array.isArray(s.entries)&&s.entries.every(e=>typeof e.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&!Number.isNaN(new Date(e.date+'T12:00:00').getTime())&&typeof e.name==='string'&&e.name.trim().length>0&&e.name.length<=80&&Number.isFinite(e.protein)&&e.protein>=0&&e.protein<=1000&&meals.includes(e.meal))}
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(valid(saved))state=saved;else $('status').textContent='儲存資料格式異常，請匯入有效備份。'}}catch(e){$('status').textContent='無法讀取瀏覽器儲存資料。'}
$('date').value=localDate(new Date());$('goal').value=state.goal;
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true}catch(e){$('status').textContent='儲存失敗，請確認瀏覽器允許儲存資料。';return false}}
const totalFor=d=>state.entries.filter(e=>e.date===d).reduce((s,e)=>s+e.protein,0);
function render(){const date=$('date').value,total=totalFor(date),pct=total/state.goal*100;$('total').textContent=num(total);$('goalText').textContent=num(state.goal);$('remaining').textContent=total>=state.goal?'已達成每日目標 ✓':'距離目標還有 '+num(state.goal-total)+' 克';$('percent').textContent=Math.round(pct)+'%';$('fill').style.width=Math.min(pct,100)+'%';$('progress').setAttribute('aria-valuemin','0');$('progress').setAttribute('aria-valuemax',state.goal);$('progress').setAttribute('aria-valuenow',Math.min(total,state.goal));const entries=state.entries.filter(e=>e.date===date);$('count').textContent=entries.length+' 筆';$('list').replaceChildren();if(!entries.length){const empty=document.createElement('div');empty.className='empty';const icon=document.createElement('span');icon.textContent='🥣';empty.append(icon,document.createTextNode('這天還沒有紀錄，新增第一餐吧。'));$('list').append(empty)}for(const meal of meals){const rows=entries.filter(e=>e.meal===meal);if(!rows.length)continue;const section=document.createElement('div');section.className='meal';const head=document.createElement('div');head.className='mealhead';const label=document.createElement('span'),sum=document.createElement('span');label.textContent=meal;sum.textContent=num(rows.reduce((s,e)=>s+e.protein,0))+' 克';head.append(label,sum);section.append(head);for(const e of rows){const row=document.createElement('div');row.className='item';const name=document.createElement('span');name.className='name';name.textContent=e.name;if(['ai-estimate','local-estimate'].includes(e.source)){const note=document.createElement('small');note.className='estimated-note';note.textContent=(e.source==='local-estimate'?'免費資料估算':'AI 估算')+(typeof e.estimate?.portion==='string'?' · '+e.estimate.portion:'');name.append(note);}const amount=document.createElement('strong');amount.textContent=(['ai-estimate','local-estimate'].includes(e.source)?'約 ':'')+num(e.protein)+' 克';const del=document.createElement('button');del.className='delete';del.textContent='刪除';del.setAttribute('aria-label','刪除 '+e.name);del.onclick=()=>{if(persist({...state,entries:state.entries.filter(x=>x.id!==e.id)})){render();$('status').textContent='已刪除紀錄。'}};const editButton=document.createElement('button');editButton.type='button';editButton.className='edit-record';editButton.textContent='編輯';editButton.setAttribute('aria-label','編輯 '+e.name);editButton.onclick=()=>window.editDiaryEntry(e.id);row.append(name,amount,editButton,del);section.append(row)}$('list').append(section)}$('week').replaceChildren();const days=Array.from({length:7},(_,i)=>shift(date,i-6)),max=Math.max(state.goal,...days.map(totalFor));for(const d of days){const val=totalFor(d),b=document.createElement('div');b.className='day'+(d===date?' active':'');b.tabIndex=0;b.setAttribute('role','button');b.setAttribute('aria-label',d+'，'+num(val)+'克');const wrap=document.createElement('div');wrap.className='bar-wrap';const bar=document.createElement('div');bar.className='bar';bar.style.height=Math.max(3,val/max*100)+'%';wrap.append(bar);const amount=document.createElement('small');amount.textContent=num(val)+'g';const label=document.createElement('span');label.textContent=d.slice(5).replace('-','/');b.append(wrap,amount,label);const choose=()=>{$('date').value=d;render()};b.onclick=choose;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};$('week').append(b)}}
$('foodForm').onsubmit=e=>{e.preventDefault();const name=$('food').value.trim(),protein=Number($('protein').value);if(!name){$('food').setCustomValidity('請輸入食物名稱');$('food').reportValidity();return}if(!Number.isFinite(protein)||protein<=0||protein>1000)return;const entry={id:typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now()+'-'+Math.random(),date:$('date').value,name,protein,meal:$('meal').value};if(persist({...state,entries:[...state.entries,entry]})){$('food').value='';$('protein').value='';render();$('status').textContent='已新增 '+name+'，'+num(protein)+' 克蛋白質。';$('food').focus()}};$('food').oninput=()=> $('food').setCustomValidity('');
$('goalForm').onsubmit=e=>{e.preventDefault();const goal=Number($('goal').value);if(Number.isFinite(goal)&&goal>=1&&goal<=1000&&persist({...state,goal})){render();$('status').textContent='每日目標已更新為 '+num(goal)+' 克。'}};
$('date').onchange=()=>{if($('date').value)render();else $('date').value=localDate(new Date())};$('prev').onclick=()=>{$('date').value=shift($('date').value,-1);render()};$('next').onclick=()=>{$('date').value=shift($('date').value,1);render()};$('today').onclick=()=>{$('date').value=localDate(new Date());render()};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='蛋白日記-'+localDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='備份已匯出。'};
$('import').onclick=()=> $('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!valid(data))throw Error();if(!confirm('匯入將取代目前紀錄與目標，是否繼續？'))return;if(persist(data)){$('goal').value=state.goal;render();$('status').textContent='備份已匯入。'}}catch(e){$('status').textContent='無法匯入，請選擇此網站匯出的有效 JSON 備份。'}finally{$('file').value=''}};render();
</script>

</style>

const panel=document.querySelector('.night-feedback');panel.hidden=false;const icon=panel.querySelector('.night-icon');icon.className='night-icon';icon.textContent=achieved?'♥':'🔔';void icon.offsetWidth;icon.classList.add(achieved?'night-heart':'night-reminder');panel.querySelector('h2').textContent=achieved?'今天達標，送你一顆愛心！':'今天的蛋白質還沒達標';panel.querySelector('.night-message').textContent=achieved?'已記錄 90 克，達成 80 克目標。':'已記錄 45／80 克，距離目標還差 35 克。若有漏記，可以補上今天的餐點。';panel.querySelector('.night-date').textContent=data.date+' · 模擬 22:00 · 非真實紀錄';}
function exitDemo(){demoActive=false;if(demoOriginalDate)$('date').value=demoOriginalDate;demoOriginalDate=null;$('demoExit').hidden=true;$('demoData').hidden=true;$('demoCaption').textContent='已結束示範，恢復你的飲食數據。';document.querySelector('.night-feedback').hidden=true;render();}
$('demoSuccess').onclick=()=>showDemo('success');$('demoBelow').onclick=()=>showDemo('below');$('demoExit').onclick=exitDemo;
// Return to real numbers before a user operates any real record controls.
document.addEventListener('click',event=>{if(demoActive&&!demo.contains(event.target)&&!document.querySelector('.night-feedback').contains(event.target))exitDemo();},true);

}

{

$('editForm').onsubmit=event=>{event.preventDefault();const original=state.entries.find(e=>e.id===editId);if(!original)return;const name=$('editName').value.trim(),protein=Number($('editProtein').value),date=$('editDate').value,meal=$('editMeal').value;if(!name){$('editName').setCustomValidity('請輸入餐點名稱');$('editName').reportValidity();return;}if(!date||!Number.isFinite(protein)||protein<0||protein>1000)return;
const updated={...original,name,protein,date,meal};const foods=(state.customFoods||[]).map(f=>({...f}));if(!original.source&&protein>0){const index=foods.findIndex(f=>f.name===original.name);const duplicate=foods.findIndex(f=>f.name===name);if(duplicate>=0)foods[duplicate]={name,protein};else if(index>=0)foods[index]={name,protein};else foods.push({name,protein});}
if(persist({...state,entries:state.entries.map(e=>e.id===editId?updated:e),customFoods:foods})){$('date').value=date;render();editDialog.close();$('status').textContent='已更新 '+name+' 的飲食紀錄。';}};
}
